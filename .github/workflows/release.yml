name: Windows Demo Artifact

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build Windows demo artifact
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build unsigned Windows installer
        run: npm run dist

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: clinic-management-system-windows
          path: dist/
          if-no-files-found: error
